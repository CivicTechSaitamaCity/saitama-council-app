server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://asia-northeast1-civictec-saitama.cloudfunctions.net/;
        proxy_ssl_server_name on;
        proxy_set_header Host asia-northeast1-civictec-saitama.cloudfunctions.net;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
